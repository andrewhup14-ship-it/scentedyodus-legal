<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herald - TikTok Authorization</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; text-align: center; }
  .box { border: 1px solid #ddd; border-radius: 12px; padding: 32px; }
  code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; word-break: break-all; display: block; margin-top: 12px; font-size: 0.85em; text-align: left; }
  h1 { font-size: 1.3em; }
</style>
</head>
<body>
<div class="box">
<h1>TikTok account connected</h1>
<p id="status">Processing authorization...</p>
<code id="params"></code>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const statusEl = document.getElementById('status');
  const paramsEl = document.getElementById('params');
  if (error) {
    statusEl.textContent = 'Authorization was not completed: ' + error;
  } else if (code) {
    statusEl.textContent = 'Authorization successful. You can close this window.';
    paramsEl.textContent = 'code=' + code.slice(0, 12) + '...\nstate=' + state;
  } else {
    statusEl.textContent = 'Waiting for authorization redirect from TikTok.';
  }
</script>
</body>
</html>
